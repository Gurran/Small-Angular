services:
  frontend-watch:
    image: node:lts-alpine3.23
    working_dir: /app
    ports:
      - '4200:4200'
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CI=true
      - NG_CLI_ANALYTICS=ci
    command: sh -lc "npm ci && npm start -- --host 0.0.0.0 --port 4200 --poll=2000"
    stdin_open: true
    tty: true
    depends_on:
      - db
    networks:
      - frontend_net

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - backend_net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=postgres;Username=postgres;Password=postgres
    ports:
      - '5000:80'
    depends_on:
      - db
    networks:
      - frontend_net
      - backend_net

volumes:
  db-data:

networks:
  frontend_net:
  backend_net:

# Notes:
# - This service mounts the project into the container and runs `ng serve`.
# - `CHOKIDAR_USEPOLLING=true` and `--poll=2000` force polling so Docker for Windows file changes are detected.
# - Use `docker compose -f docker-compose.watch.yml up --build` to start.
